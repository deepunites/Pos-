# Проверки на каждый PR и на push в main. До этого в репозитории не было ни CI,
# ни линтера: 13 000 строк фронтенда держал только tsc, запускаемый вручную.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Тесты идут на настоящем Postgres 16 — том же движке, что в проде.
    # Образ на Debian (не -alpine): локаль en_US.UTF-8 складывает кириллицу
    # в поиске без учёта регистра, как у Railway.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qwik
          POSTGRES_PASSWORD: qwik
          POSTGRES_DB: qwik_shadow
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qwik -d qwik_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://qwik:qwik@localhost:5432/qwik_test?schema=public&connection_limit=5&options=-c%20TimeZone%3DUTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend-admin/package-lock.json
            pos-terminal/package-lock.json

      # Пакеты устанавливаются отдельно: workspaces в репозитории ещё нет
      # (задача FE-2), у каждого приложения свой package-lock.json.
      - name: Install
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend-admin
          npm ci --prefix pos-terminal

      # Без сгенерированного клиента не проходит ни typecheck бэкенда, ни тесты.
      - name: Prisma client
        run: npm run db:generate --prefix backend

      # lint:budget — это lint плюс ограничение на число предупреждений.
      # Сегодня их 5, и все — react-refresh (вспомогательные функции рядом с компонентами);
      # доступность (D-6) закрыта до нуля;
      # any, неиспользуемые переменные и правила хуков — везде ошибки. Число разрешено только уменьшать: любой PR,
      # который добавит новое предупреждение, станет красным.
      - name: Lint
        run: npm run lint:budget

      - name: Typecheck
        run: npm run typecheck

      # Миграции должны описывать ровно то, что в schema.prisma. Если кто-то
      # поменял схему и забыл миграцию, прод получил бы не ту базу — шаг падает.
      # qwik_shadow — пустая служебная база для этого сравнения.
      - name: Migrations match schema
        working-directory: backend
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://qwik:qwik@localhost:5432/qwik_shadow"
          --exit-code

      # Юнит-тесты фронтендов: корзина и деньги кассы, вес, остатки на полке,
      # права по ролям в панели, хук сокета. Базы не требуют.
      - name: Frontend tests
        run: npm run test:frontend

      # Тесты сами поднимают свой сервер на своей базе qwik_test
      # (backend/tests/globalSetup.ts) и заглушки вместо внешних API.
      - name: Tests
        run: npm test

      # Сквозной тест кассы: Playwright поднимает свой бэкенд (база
      # qwik_e2e_test с демо-данными) и кассу и проходит день кассира в
      # браузере — привязка, PIN, смена, скан, оплата. Отчёт с трейсом — в
      # артефактах, если тест упал.
      - name: Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Сборка проверяет то, что linter и tsc не видят: что Vite реально
      # собирает оба фронтенда.
      - name: Build frontends
        run: |
          npm run build:admin
          npm run build:terminal
